<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">VibrantLearn</title>
  <desc id="d">Tell us your exam. We'll plan the hours you have. Floating cards show a study plan, a Kannada request, a live class and a quiz score.</desc>
  <defs>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A3D"/><stop offset=".5" stop-color="#C2389B"/><stop offset="1" stop-color="#6A3BE4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".2" r=".6">
      <stop offset="0" stop-color="#6A3BE4" stop-opacity=".35"/><stop offset="1" stop-color="#6A3BE4" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1C1633" flood-opacity=".18"/>
    </filter>
  </defs>
  <style>
    .bg{fill:#F5F2FB}.ink{fill:#1C1633}.muted{fill:#5E5675}.card{fill:#fff}.chip{fill:#FF6A3D}.leaf{fill:#14A37F}.violet{fill:#6A3BE4}.live{fill:#0B7559}
    .disp{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif;font-weight:800}
    .ui{font-family:Figtree,'Segoe UI',Helvetica,Arial,sans-serif}
    .kn{font-family:'Noto Sans Kannada','Nirmala UI',Tunga,sans-serif}
    .f1{animation:fl 6s ease-in-out infinite}.f2{animation:fl 7s ease-in-out -2s infinite}
    .f3{animation:fl 6.5s ease-in-out -4s infinite}.f4{animation:fl 7.5s ease-in-out -1s infinite}
    .path{stroke-dasharray:10 12;animation:dash 3s linear infinite}
    .pulse{animation:pu 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .dot{animation:tw 3s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes dash{to{stroke-dashoffset:-44}}
    @keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.25}}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
    @media (prefers-color-scheme:dark){
      .bg{fill:#120E22}.ink{fill:#F5F2FB}.muted{fill:#B2A9C9}.card{fill:#221B3D}.live{fill:#3DD6A6}
    }
    @media (prefers-reduced-motion:reduce){.f1,.f2,.f3,.f4,.path,.pulse,.dot{animation:none}}
  </style>

  <rect class="bg" width="1200" height="440" rx="28"/>
  <rect width="1200" height="440" rx="28" fill="url(#glow)"/>
  <circle class="dot violet" cx="1120" cy="60" r="3"/>
  <circle class="dot chip" cx="640" cy="390" r="3" style="animation-delay:-1s"/>
  <circle class="dot violet" cx="1010" cy="410" r="2.5" style="animation-delay:-2s"/>

  <!-- wordmark + headline -->
  <text x="64" y="96" class="disp ink" font-size="40" letter-spacing="-1">vibrantlearn<tspan fill="#FF6A3D">.</tspan></text>
  <text x="64" y="186" class="disp ink" font-size="54" letter-spacing="-2">Tell us your exam.</text>
  <text x="64" y="250" class="disp ink" font-size="54" letter-spacing="-2">We'll plan the hours</text>
  <text x="64" y="314" class="disp ink" font-size="54" letter-spacing="-2">you have.</text>
  <text x="64" y="366" class="ui muted" font-size="19">Study plans, notes, quizzes and live evening classes for BCA students,</text>
  <text x="64" y="392" class="ui muted" font-size="19">in English, Kannada and Hindi.</text>

  <!-- learning path joining the cards -->
  <path class="path" d="M700 120 C 760 200, 860 150, 900 230 S 1000 330, 1080 300" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>

  <!-- plan card -->
  <g class="f1"><g filter="url(#sh)">
    <rect class="card" x="660" y="52" width="300" height="118" rx="18"/>
    <text x="698" y="84" class="ui muted" font-size="14">8:45 – 9:30 PM</text>
    <rect class="chip" x="812" y="70" width="48" height="20" rx="10"/>
    <text x="836" y="85" class="ui ink" font-size="12" font-weight="700" text-anchor="middle" fill="#1C1633" style="fill:#1C1633">Now</text>
    <text x="684" y="114" class="ui ink" font-size="17" font-weight="600">Inheritance and overriding</text>
    <rect x="684" y="134" width="252" height="8" rx="4" fill="#E7E1F5"/>
    <rect x="684" y="134" width="150" height="8" rx="4" fill="url(#route)"/>
    <circle class="pulse" cx="686" cy="79" r="5" fill="#FF6A3D"/>
  </g></g>

  <!-- Kannada request bubble -->
  <g class="f2"><g filter="url(#sh)">
    <rect x="980" y="96" width="196" height="84" rx="18" fill="#6A3BE4"/>
    <text x="998" y="128" class="kn" font-size="17" fill="#fff">ನಾಳೆ Java internal</text>
    <text x="998" y="156" class="ui" font-size="14" fill="#E9E2FF">10 AM · BCA SEP · quiz</text>
  </g></g>

  <!-- live class card -->
  <g class="f3"><g filter="url(#sh)">
    <rect class="card" x="742" y="236" width="270" height="104" rx="18"/>
    <circle class="pulse" cx="768" cy="266" r="6" fill="#14A37F"/>
    <text x="784" y="271" class="ui" font-size="14" font-weight="700" class="ui live">Live now</text>
    <text x="766" y="300" class="ui ink" font-size="17" font-weight="600">DBMS: normal forms</text>
    <text x="766" y="324" class="ui muted" font-size="14">14 of 40 seats · bot keeps chat safe</text>
  </g></g>

  <!-- quiz score card -->
  <g class="f4"><g filter="url(#sh)">
    <rect class="card" x="1036" y="246" width="136" height="104" rx="18"/>
    <text x="1104" y="292" class="disp ink" font-size="34" text-anchor="middle">8/10</text>
    <text x="1104" y="322" class="ui muted" font-size="14" text-anchor="middle">quiz score</text>
  </g></g>
</svg>
