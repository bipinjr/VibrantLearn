[project]
name = "vibrantlearn-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.20.1",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "yake>=0.7.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
# train.py writes docs/ml-report.md from a Markdown template (long prose lines, a literal ×).
"app/ml/train.py" = ["E501", "RUF001"]
# Seeded generator for synthetic training data; randomness here is not security.
"data/build_intents.py" = ["S311", "E501"]
# Column-aligned fake table rows (formatter is told to skip them).
"tests/fake_db.py" = ["E501"]
# Student-facing sentences and SQL kept on one line each, so they read like the rules they encode.
"app/services/classes.py" = ["E501"]
"app/services/class_chat.py" = ["E501"]
"app/ml/moderate.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type stubs published for these.
module = ["sklearn.*", "joblib.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
